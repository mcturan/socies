<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Socies Pocket - Retro El Konsolu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --case-grad: linear-gradient(180deg, #5b3294 0%, #371861 100%);
      --case-edge: #220b40;
      --bezel-bg: #140d24;
      --oled-bg: #000814;
      --oled-yellow: #ffb703;
      --oled-blue: #00f0ff;
      --btn-grad: linear-gradient(180deg, #6c3da8, #3e1b69);
      --btn-active: #270e47;
      --btn-border: #2b1150;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #09030e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      padding: 0.5rem;
      overflow: hidden;
    }

    /* RETRO HANDHELD CASING */
    .handheld-chassis {
      width: 100%;
      max-width: 400px;
      height: 96vh;
      max-height: 820px;
      background: var(--case-grad);
      border: 4px solid var(--case-edge);
      border-radius: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.25), inset 0 -6px 12px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.2rem 1.2rem;
      position: relative;
    }

    /* TOP ACCENTS */
    .chassis-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }
    .power-led {
      width: 9px;
      height: 9px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff66;
      animation: pulseLed 2s infinite ease-in-out;
    }
    .device-id-badge {
      font-size: 0.7rem;
      background: rgba(0,0,0,0.4);
      color: #00ff66;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      border: 1px solid rgba(0,255,102,0.3);
      font-weight: 800;
    }
    .retro-brand {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      color: #e2d1f9;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* OLED SCREEN BEZEL */
    .screen-bezel {
      background: var(--bezel-bg);
      border: 3px solid #140d20;
      border-radius: 20px;
      padding: 10px 8px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.8), 0 2px 4px rgba(255,255,255,0.1);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bezel-label {
      font-size: 0.65rem;
      color: #8c7aa8;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: 800;
    }

    /* OLED CANVAS (128x64 native, scaled) */
    .oled-screen {
      background: var(--oled-bg);
      border-radius: 6px;
      border: 2px solid #0a1128;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0,0,0,0.9);
      image-rendering: pixelated;
      width: 100%;
      max-width: 340px;
      height: 170px;
    }

    /* MID SECTION (INFO & SPEAKER) */
    .mid-status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0 0.5rem 0;
      padding: 0 0.5rem;
      color: #b79ced;
      font-size: 0.75rem;
      font-weight: 800;
    }

    /* 4 HORIZONTAL BUTTONS AT THE BOTTOM */
    .horizontal-buttons-row {
      margin-top: auto;
      margin-bottom: 0.5rem;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.2rem;
    }

    .retro-horiz-btn {
      flex: 1;
      height: 74px;
      background: var(--btn-grad);
      border: 3px solid var(--btn-border);
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.08s ease, background 0.08s ease;
    }
    .retro-horiz-btn:active, .retro-horiz-btn.pressed {
      transform: translateY(4px) scale(0.96);
      background: var(--btn-active);
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .horiz-btn-icon {
      font-size: 1.4rem;
      font-weight: 900;
      color: #fff;
    }
    .horiz-btn-lbl {
      font-size: 0.62rem;
      font-weight: 800;
      color: #d6bdf5;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* PAGER ALERT OVERLAY */
    .pager-popup {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 240, 255, 0.96);
      color: #000;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem;
      padding: 0.8rem 1.2rem;
      border-radius: 14px;
      box-shadow: 0 0 24px rgba(0,240,255,0.8);
      z-index: 50;
      display: none;
      text-align: center;
      line-height: 1.6;
    }

    @keyframes pulseLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="handheld-chassis">
    
    <!-- TOP ACCENTS -->
    <div class="chassis-top">
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="power-led"></div>
        <span style="font-size:0.65rem; color:#84cc16; font-weight:800;">PWR</span>
      </div>
      <div class="retro-brand">SOCIES</div>
      <div class="device-id-badge" id="dispDeviceId">ID: 84920A</div>
    </div>

    <!-- OLED SCREEN BEZEL -->
    <div class="screen-bezel">
      <div class="bezel-label">0.96" SSD1315 OLED (128x64 DUAL MONOCHROME)</div>
      <canvas id="oledCanvas" class="oled-screen" width="128" height="64"></canvas>
    </div>

    <!-- PAGER TOAST -->
    <div id="pagerPopup" class="pager-popup"></div>

    <!-- MID INFO -->
    <div class="mid-status-bar">
      <span>MAC: A4:CF:12:89:34:B1</span>
      <span id="bridgeLiveText" style="color:#00ff66;">🟢 BLE HAZIR</span>
    </div>

    <!-- 4 HORIZONTAL BUTTONS AT BOTTOM (YAN YANA 4 TUŞ) -->
    <div class="horizontal-buttons-row">
      <!-- 1. SOL / GERİ AL -->
      <button class="retro-horiz-btn" id="btnLeft" onpointerdown="handleBtnPress('LEFT')" onpointerup="handleBtnRelease('LEFT')">
        <span class="horiz-btn-icon">◄</span>
        <span class="horiz-btn-lbl">SOL</span>
      </button>

      <!-- 2. SAĞ / İLERİ -->
      <button class="retro-horiz-btn" id="btnRight" onpointerdown="handleBtnPress('RIGHT')" onpointerup="handleBtnRelease('RIGHT')">
        <span class="horiz-btn-icon">►</span>
        <span class="horiz-btn-lbl">SAĞ</span>
      </button>

      <!-- 3. SEÇ / ONAY -->
      <button class="retro-horiz-btn" id="btnSelect" style="border-color:#059669;" onpointerdown="handleBtnPress('SELECT')" onpointerup="handleBtnRelease('SELECT')">
        <span class="horiz-btn-icon" style="color:#34d399;">●</span>
        <span class="horiz-btn-lbl">SEÇ</span>
      </button>

      <!-- 4. GERİ / MENÜ -->
      <button class="retro-horiz-btn" id="btnBack" style="border-color:#dc2626;" onpointerdown="handleBtnPress('BACK')" onpointerup="handleBtnRelease('BACK')">
        <span class="horiz-btn-icon" style="color:#f87171;">✕</span>
        <span class="horiz-btn-lbl">GERİ</span>
      </button>
    </div>

  </div>

  <script>
    // --- 8-BIT AUDIO SYNTHESIZER ---
    let audioCtx = null;
    function playRetroBeep(freq = 440, type = 'square', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // --- CONSOLE STATE (7 SIMS NEEDS & MINI-GAMES) ---
    const consoleState = {
      deviceId: '84920A',
      mac: 'A4:CF:12:89:34:B1',
      batteryPct: 88,
      batteryMv: 3980,
      steps: 2450,
      
      // 7 Sims Needs
      needs: {
        hunger: 85,
        toilet: 80,
        clean: 90,
        sleep: 80,
        fun: 85,
        social: 75,
        love: 90
      },

      mode: 'IDLE', // IDLE, MENU, GAME_RPS, GAME_COWBOY, GAME_FLAPPY, GAME_RHYTHM, EATING, SLEEPING, POOP
      menuIdx: 0,
      menuItems: ['BESLE 🍗', 'TUVALET 🚽', 'BANYO 🧼', 'OYUNLAR 🎮', 'UYUT 💤', 'DUELLO ⚔️', 'STAT 📊'],
      gamesList: ['TAS-KAGIT', 'KOVBOY', 'ZIPLAMA', 'RITIM'],
      gameSubIdx: 0,
      
      hasPoop: false,
      petX: 48,
      petDir: 1,
      animFrame: 0,
      customSprite: null,
      lastTickerText: 'SOCIES BLE HAZIR'
    };

    // --- OLED CANVAS RENDERER ---
    const canvas = document.getElementById('oledCanvas');
    const ctx = canvas.getContext('2d');

    // Default 16x16 Cat Sprite
    const retroCatSprite = [
      "0100000000000010",
      "1110000000000111",
      "1111000000001111",
      "1111111111111111",
      "1110111111110111",
      "1111111111111111",
      "0111111111111110",
      "0011101111011100",
      "0001111111111000",
      "0011111111111100",
      "0111111111111110",
      "0111111111111110",
      "0111111111111110",
      "0011111111111100",
      "0011001111001100",
      "0110001111000110"
    ];

    function drawOledScreen() {
      // Clear Screen
      ctx.fillStyle = '#000814';
      ctx.fillRect(0, 0, 128, 64);

      // --- 1. TOP 16 PIXELS: YELLOW STATUS BAR ---
      ctx.fillStyle = '#ffb703';
      
      // Battery Icon
      ctx.strokeRect(102, 3, 20, 9);
      ctx.fillRect(122, 5, 2, 5);
      const battFill = Math.round((consoleState.batteryPct / 100) * 16);
      ctx.fillRect(104, 5, battFill, 5);
      
      ctx.font = '7px "JetBrains Mono"';
      ctx.fillText(consoleState.batteryPct + '%', 82, 10);

      // 4 Hearts (Overall Health)
      const health = Math.round((consoleState.needs.hunger + consoleState.needs.fun + consoleState.needs.love) / 3);
      const heartsCount = Math.ceil((health / 100) * 4);
      for(let i=0; i<heartsCount; i++) {
        ctx.fillRect(4 + i * 9, 4, 7, 7);
      }

      // Steps / Device ID
      ctx.fillText('ID:' + consoleState.deviceId, 42, 10);

      // Divider line (Yellow / Blue)
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 15, 128, 1);

      // --- 2. BOTTOM 48 PIXELS: CYAN BLUE GAMEPLAY ---
      ctx.fillStyle = '#00f0ff';

      if (consoleState.mode === 'MENU') {
        renderHorizontalMenu();
      } else if (consoleState.mode === 'MENU_GAMES') {
        renderGamesMenu();
      } else if (consoleState.mode === 'GAME_RPS') {
        renderGameRPS();
      } else if (consoleState.mode === 'GAME_COWBOY') {
        renderGameCowboy();
      } else if (consoleState.mode === 'GAME_FLAPPY') {
        renderGameFlappy();
      } else if (consoleState.mode === 'EATING') {
        renderEating();
      } else if (consoleState.mode === 'SLEEPING') {
        renderSleeping();
      } else {
        renderIdlePet();
      }

      consoleState.animFrame++;
      requestAnimationFrame(drawOledScreen);
    }

    function renderIdlePet() {
      ctx.fillStyle = '#00f0ff';

      // Walk back and forth
      if (consoleState.animFrame % 50 === 0) {
        consoleState.petX += consoleState.petDir * 5;
        if (consoleState.petX > 85) consoleState.petDir = -1;
        if (consoleState.petX < 20) consoleState.petDir = 1;
      }

      const bob = (consoleState.animFrame % 16 < 8) ? 0 : 1;
      drawSprite(consoleState.petX, 30 + bob);

      // Poop icon if toilet needed
      if (consoleState.hasPoop) {
        ctx.fillRect(100, 42, 6, 6);
        ctx.fillRect(102, 38, 2, 4);
        ctx.font = '7px "JetBrains Mono"';
        ctx.fillText('💩', 108, 46);
      }

      // Bottom Ticker
      ctx.font = '7px "JetBrains Mono"';
      ctx.fillText(consoleState.lastTickerText, 8, 60);
    }

    function renderHorizontalMenu() {
      ctx.fillStyle = '#00f0ff';
      ctx.font = '8px "JetBrains Mono"';
      ctx.fillText('=== ANA MENÜ ===', 24, 25);
      
      const current = consoleState.menuItems[consoleState.menuIdx];
      ctx.font = '9px "JetBrains Mono"';
      ctx.fillText('◄  [' + current + ']  ►', 10, 42);
      ctx.font = '7px "JetBrains Mono"';
      ctx.fillText('SEÇ: Onayla | GERİ: Çık', 10, 58);
    }

    function renderGamesMenu() {
      ctx.fillStyle = '#00f0ff';
      ctx.font = '8px "JetBrains Mono"';
      ctx.fillText('=== OYUN SEÇİMİ ===', 16, 25);
      
      const current = consoleState.gamesList[consoleState.gameSubIdx];
      ctx.font = '9px "JetBrains Mono"';
      ctx.fillText('◄  [' + current + ']  ►', 12, 42);
      ctx.font = '7px "JetBrains Mono"';
      ctx.fillText('SEÇ: Başlat | GERİ: İptal', 8, 58);
    }

    // --- MINI GAMES IN OLED ---
    let cowboyTimer = 0;
    let cowboyCanShoot = false;

    function renderGameCowboy() {
      ctx.fillStyle = '#00f0ff';
      ctx.font = '8px "JetBrains Mono"';
      ctx.fillText('KOVBOY DUELLOSU', 18, 25);
      
      if (!cowboyCanShoot) {
        ctx.fillText('HAZIRLAN...', 36, 42);
        if (Math.random() < 0.02 && cowboyTimer > 60) {
          cowboyCanShoot = true;
          playRetroBeep(988, 'sawtooth', 0.2);
        }
      } else {
        ctx.fillStyle = '#ffb703';
        ctx.fillText('>> ATES ET! <<', 22, 42);
      }
      cowboyTimer++;
    }

    function renderGameRPS() {
      ctx.fillStyle = '#00f0ff';
      ctx.font = '8px "JetBrains Mono"';
      ctx.fillText('TAS - KAGIT - MAKAS', 10, 25);
      const hands = ['TAS ✊', 'KAGIT ✋', 'MAKAS ✌️'];
      const hand = hands[Math.floor(consoleState.animFrame / 30) % 3];
      ctx.font = '10px "JetBrains Mono"';
      ctx.fillText(hand, 38, 44);
    }

    function renderGameFlappy() {
      ctx.fillStyle = '#00f0ff';
      ctx.font = '8px "JetBrains Mono"';
      ctx.fillText('ZIPLAYAN BEBEK', 20, 25);
      const jump = Math.abs(Math.sin(consoleState.animFrame * 0.15)) * 14;
      drawSprite(40, 44 - jump);
      // Obstacle pipe
      const pipeX = (128 - (consoleState.animFrame * 2 % 140));
      ctx.fillRect(pipeX, 36, 8, 16);
    }

    function renderEating() {
      ctx.fillStyle = '#00f0ff';
      drawSprite(36, 32);
      ctx.fillRect(72, 38, 8, 8);
      ctx.font = '8px "JetBrains Mono"';
      ctx.fillText('MAMA YIYOR! 🍗', 26, 25);
    }

    function renderSleeping() {
      ctx.fillStyle = '#00f0ff';
      drawSprite(48, 38);
      ctx.font = '9px "JetBrains Mono"';
      const zOffset = (consoleState.animFrame % 30);
      ctx.fillText('z', 72, 34 - zOffset * 0.3);
      ctx.fillText('Z', 78, 28 - zOffset * 0.4);
    }

    function drawSprite(x, y) {
      if (consoleState.customSprite) {
        for(let r=0; r<24; r++) {
          for(let c=0; c<24; c++) {
            if (consoleState.customSprite[r] && consoleState.customSprite[r][c]) {
              ctx.fillRect(x + c, y + r - 8, 1, 1);
            }
          }
        }
      } else {
        for(let r=0; r<16; r++) {
          for(let c=0; c<16; c++) {
            if (retroCatSprite[r][c] === '1') {
              ctx.fillRect(x + c, y + r, 1, 1);
            }
          }
        }
      }
    }

    // --- HORIZONTAL 4 BUTTON CONTROLLER ---
    function handleBtnPress(btn) {
      if (window.navigator.vibrate) window.navigator.vibrate(35);
      
      const idMap = { 'LEFT': 'btnLeft', 'RIGHT': 'btnRight', 'SELECT': 'btnSelect', 'BACK': 'btnBack' };
      document.getElementById(idMap[btn])?.classList.add('pressed');

      playRetroBeep(btn === 'SELECT' ? 880 : (btn === 'BACK' ? 330 : 520), 'square', 0.06);

      if (btn === 'LEFT') {
        if (consoleState.mode === 'MENU') {
          consoleState.menuIdx = (consoleState.menuIdx - 1 + consoleState.menuItems.length) % consoleState.menuItems.length;
        } else if (consoleState.mode === 'MENU_GAMES') {
          consoleState.gameSubIdx = (consoleState.gameSubIdx - 1 + consoleState.gamesList.length) % consoleState.gamesList.length;
        } else {
          consoleState.mode = 'MENU';
        }
      } else if (btn === 'RIGHT') {
        if (consoleState.mode === 'MENU') {
          consoleState.menuIdx = (consoleState.menuIdx + 1) % consoleState.menuItems.length;
        } else if (consoleState.mode === 'MENU_GAMES') {
          consoleState.gameSubIdx = (consoleState.gameSubIdx + 1) % consoleState.gamesList.length;
        } else {
          consoleState.mode = 'MENU';
        }
      } else if (btn === 'SELECT') {
        if (consoleState.mode === 'MENU') {
          handleMenuSelect();
        } else if (consoleState.mode === 'MENU_GAMES') {
          handleGameSelect();
        } else if (consoleState.mode === 'GAME_COWBOY') {
          if (cowboyCanShoot) {
            playRetroBeep(1200, 'sine', 0.3);
            consoleState.lastTickerText = 'KAZANDIN! +50 XP';
            consoleState.mode = 'IDLE';
          }
        } else {
          consoleState.mode = 'MENU';
        }
      } else if (btn === 'BACK') {
        consoleState.mode = 'IDLE';
        consoleState.lastTickerText = 'SOCIES BLE HAZIR';
      }
    }

    function handleBtnRelease(btn) {
      const idMap = { 'LEFT': 'btnLeft', 'RIGHT': 'btnRight', 'SELECT': 'btnSelect', 'BACK': 'btnBack' };
      document.getElementById(idMap[btn])?.classList.remove('pressed');
    }

    function handleMenuSelect() {
      const selected = consoleState.menuItems[consoleState.menuIdx];
      if (selected.includes('BESLE')) {
        consoleState.mode = 'EATING';
        consoleState.needs.hunger = Math.min(100, consoleState.needs.hunger + 20);
        setTimeout(() => consoleState.mode = 'IDLE', 3000);
      } else if (selected.includes('TUVALET')) {
        consoleState.hasPoop = false;
        consoleState.needs.toilet = 100;
        consoleState.lastTickerText = 'TUVALET TEMIZLENDI!';
        consoleState.mode = 'IDLE';
      } else if (selected.includes('BANYO')) {
        consoleState.needs.clean = 100;
        consoleState.lastTickerText = 'BEBEK PIRIL PIRIL!';
        consoleState.mode = 'IDLE';
      } else if (selected.includes('OYUNLAR')) {
        consoleState.mode = 'MENU_GAMES';
      } else if (selected.includes('UYUT')) {
        consoleState.mode = 'SLEEPING';
        setTimeout(() => consoleState.mode = 'IDLE', 4000);
      } else if (selected.includes('DUELLO')) {
        consoleState.mode = 'GAME_COWBOY';
        cowboyTimer = 0;
        cowboyCanShoot = false;
      } else {
        consoleState.mode = 'IDLE';
      }
    }

    function handleGameSelect() {
      const g = consoleState.gamesList[consoleState.gameSubIdx];
      if (g === 'KOVBOY') {
        consoleState.mode = 'GAME_COWBOY';
        cowboyTimer = 0;
        cowboyCanShoot = false;
      } else if (g === 'TAS-KAGIT') {
        consoleState.mode = 'GAME_RPS';
      } else if (g === 'ZIPLAMA') {
        consoleState.mode = 'GAME_FLAPPY';
      } else {
        consoleState.mode = 'IDLE';
      }
    }

    // --- REALTIME BRIDGE RECEIVER ---
    try {
      const bc = new BroadcastChannel('socies_device_bridge');
      bc.onmessage = (e) => handleBridgeIncoming(e.data);
    } catch(e) {}

    let lastEvId = 0;
    setInterval(() => {
      fetch('/api/v1/bridge/events?since=' + lastEvId)
        .then(r => r.json())
        .then(d => {
          if (d && d.events && d.events.length > 0) {
            d.events.forEach(ev => {
              lastEvId = Math.max(lastEvId, ev.id);
              if (ev.sender === 'companion') handleBridgeIncoming(ev);
            });
          }
        }).catch(() => {});
    }, 1000);

    function handleBridgeIncoming(event) {
      const type = event.type;
      const payload = event.payload || {};

      playRetroBeep(880, 'sine', 0.15);
      if (window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);

      if (type === 'ACTION') {
        if (payload.action === 'FEED') {
          consoleState.mode = 'EATING';
          consoleState.needs.hunger = Math.min(100, consoleState.needs.hunger + 15);
          consoleState.lastTickerText = 'TELEFONDAN MAMA GELDI!';
          setTimeout(() => { consoleState.mode = 'IDLE'; consoleState.lastTickerText = 'SOCIES BLE HAZIR'; }, 3000);
        } else if (payload.action === 'CLEAN_TOILET') {
          consoleState.hasPoop = false;
          consoleState.needs.toilet = 100;
          consoleState.lastTickerText = 'TUVALET TEMIZLENDI!';
        } else if (payload.action === 'BATH') {
          consoleState.needs.clean = 100;
          consoleState.lastTickerText = 'BANYO YAPILDI!';
        } else if (payload.action === 'PLAY_GAME') {
          consoleState.mode = 'GAME_COWBOY';
          cowboyTimer = 0;
          cowboyCanShoot = false;
        }
      } else if (type === 'HABIT') {
        consoleState.lastTickerText = payload.title || 'ALISKANLIK TAMAM! +XP';
        setTimeout(() => consoleState.lastTickerText = 'SOCIES BLE HAZIR', 3000);
      } else if (type === 'PAGER') {
        showPager(payload.label || 'ÇAGRI', payload.code || '07734');
      } else if (type === 'CUSTOM_AVATAR') {
        consoleState.customSprite = payload.grid;
        consoleState.lastTickerText = 'MODULER KARAKTER YUKLENDI!';
        setTimeout(() => consoleState.lastTickerText = 'SOCIES BLE HAZIR', 3500);
      }
    }

    function showPager(lbl, code) {
      const el = document.getElementById('pagerPopup');
      el.innerHTML = `<div>📟 ÇAĞRI KODU</div><div style="font-size:1rem; margin:6px 0; color:#dc2626;">${code}</div><div>"${lbl}"</div>`;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 4000);
    }

    // Start drawing loop
    drawOledScreen();
  </script>
</body>
</html>
